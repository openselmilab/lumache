name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: [ main ] # Si attiva a ogni push sul ramo principale

# Imposta i permessi minimi necessari per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita che build multiple si sovrappongano
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    # 1. Scarica il codice del repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configura Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Installa le dipendenze, Sphinx e il tuo pacchetto
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme numpy
        pip install -e .

    # 4. Compila la documentazione puntando alla cartella corretta
    - name: Build Sphinx Documentation
      run: |
        sphinx-build -b html docs/source docs/build/html

    # 5. Carica SOLO i file HTML generati (e non l'intero progetto)
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/build/html/' # Lo slash finale assicura che vengano presi solo i file interni

    # 6. Pubblica il sito web online
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
